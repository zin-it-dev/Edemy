[project]
name = "api"
version = "0.1.0"
description = "Discover and learn about any topic 🔖"
authors = [
    {name = "viktorcyber",email = "zin.it.dev@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django (>=6.0.2,<7.0.0)",
    "djangorestframework (>=3.16.1,<4.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "drf-spectacular[sidecar] (>=0.29.0,<0.30.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "dj-database-url (>=3.1.0,<4.0.0)",
    "django-model-utils (>=5.0.0,<6.0.0)",
    "sentry-sdk (>=2.53.0,<3.0.0)",
    "django-taggit (>=6.1.0,<7.0.0)",
    "django-cloudinary-storage (>=0.3.0,<0.4.0)",
    "pillow (>=12.1.1,<13.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "django-debug-toolbar (>=6.2.0,<7.0.0)",
    "pytest-django (>=4.11.1,<5.0.0)",
    "pytest-factoryboy (>=2.8.1,<3.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "ruff (>=0.15.1,<0.16.0)"
]

[tool.ruff]
line-length = 88
indent-width = 2
exclude = [
    ".git",
    ".venv",
    "migrations",
    "*.pyc",
    "__pycache__",
    ".ruff_cache"
]

[tool.ruff.lint]
ignore = [
    "ISC001", "D203", "D213", "D100", 
    "D101", "D103", "F403", "ANN201", 
    "TRY003", "EM101", "F405", "ARG005",
    "E501", "E402", "ANN001", "D102",
    "D106", "ARG001", "RET504", "RUF012",
    "D105", "ANN204", "ANN003", "D107",
    "ANN002"
]
select = [
    "ANN", # flake8-annotations
    "ARG", # flake8-arguments
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "C90", # mccabe complexity
    "D",   # pydocstyle
    "DJ",  # flake8-django
    "DTZ", # flake8-datetimez
    "E",   # pycodestyle
    "EM",  # flake8-errmsg
    "F",   # flake8
    "G",   # flake8-logging-format
    "I",   # isort
    "ISC", # flake8-implicit-str-concat
    "LOG", # flake8-logging
    "N",   # pep8-naming
    "PIE", # flake8-pie
    "PT",  # flake8-pytest-style
    "PTH", # flake8-use-pathlib
    "RET", # flake8-return
    "RUF", # ruff-specific rules
    "Q",   # flake8-quotes
    "SIM", # flake8-simplify
    "T10", # flake8-print
    "TCH", # flake8-type-checking
    "TRY", # tryceratops
    "UP",  # pyupgrade
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]
"__init__.py" = ["D"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"