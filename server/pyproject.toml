dependencies = [
    "clerk-backend-api (==4.1.3)",
    "cloudinary (==1.44.1)",
    "django (==5.2.9)",
    "django-chartjs (==2.3.0)",
    "django-ckeditor (==6.7.3)",
    "django-cloudinary-storage (==0.3.0)",
    "django-cors-headers (==4.9.0)",
    "django-elasticsearch-dsl (==8.2)",
    "django-filter (==25.2)",
    "django-import-export (==4.3.14)",
    "django-model-utils (==5.0.0)",
    "django-redis (==6.0.0)",
    "django-taggit (==6.1.0)",
    "djangorestframework (==3.16.1)",
    "docutils (==0.22.3)",
    "drf-extensions (==0.8.0)",
    "drf-nested-routers (==0.95.0)",
    "drf-spectacular (==0.29.0)",
    "drf-spectacular-sidecar (==2025.10.1)",
    "elasticsearch (==8.19.2)",
    "elasticsearch-dsl (==8.18.0)",
    "markdown (==3.10)",
    "pillow (==12.0.0)",
    "psycopg2-binary (==2.9.11)",
    "python-dotenv (==1.2.1)",
    "redis (==7.1.0)",
    "requests (==2.32.5)",
    "sentry-sdk (==2.43.0)",
    "svix (==1.82.0)",
    "django-pdf-actions (==0.1.52)",
    "dj-database-url (>=3.0.1,<4.0.0)"
