[project]
name = "server"
version = "0.1.0"
description = "Discover and learn about any topic 🔖"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "clerk-backend-api>=6.0.1",
    "deepagents>=0.6.12",
    "dj-database-url>=3.1.2",
    "django>=6.0.6",
    "django-cloudinary-storage>=0.3.0",
    "django-cors-headers>=4.9.0",
    "django-extensions>=4.1",
    "django-filter>=25.2",
    "django-model-utils>=5.0.0",
    "django-unfold>=0.101.0",
    "djangorestframework>=3.17.1",
    "drf-restwind>=1.3.1",
    "drf-spectacular[sidecar]>=0.30.0",
    "gunicorn>=26.0.0",
    "inngest>=0.5.19",
    "langchain>=1.3.14",
    "langgraph>=1.2.9",
    "markdown>=3.10.2",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary]>=3.3.4",
    "pygments>=2.20.0",
    "python-dotenv>=1.2.2",
    "redis[hiredis]>=8.0.1",
    "pyjwt>=2.10.1",
    "cryptography>=43.0.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=7.0.0",
    "django-silk>=5.5.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "pytest-factoryboy>=2.8.1",
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
exclude = ["**/migrations/*.py"]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP"  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
    "E741",  # ambiguous variable name 'l', 'O', or 'I'
    "F403",  # 'from module import *' used; unable to detect undefined names
    "F405",  # 'from module import *' used; unable to detect undefined names
    "E402",  # module level import not at top of file
]

[tool.djlint]
profile = "django"
ignore = "H020,H021"

