services:
  web:
    build:
      context: ./packages/web
      dockerfile: ./Dockerfile
      target: production
    ports:
      - 8080:8080
    env_file:
      - ./packages/web/.env

  server:
    restart: unless-stopped
    build:
      context: ./server
      dockerfile: Dockerfile
      target: production
    ports:
      - 8000:8000
    env_file:
      - ./server/.env.prod

  nginx:
    build: 
      context: ./server
      target: nginx-proxy
    restart: unless-stopped
    volumes:
      - static_volume:/home/app/staticfiles
    ports:
      - 1337:80
    depends_on:
      - server

volumes:
  static_volume: