[project]
name = "api"
version = "0.1.0"
description = "Discover and learn about any topic 🔖"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "clerk-backend-api>=6.0.0",
    "dj-database-url>=3.1.2",
    "django>=6.0.5",
    "django-chartjs>=2.3.0",
    "django-cloudinary-storage>=0.3.0",
    "django-cors-headers>=4.9.0",
    "django-elasticsearch-dsl>=9.0",
    "django-filter>=25.2",
    "django-jazzmin>=3.0.4,<4.0.0",
    "djangorestframework>=3.17.1",
    "docutils>=0.23",
    "drf-spectacular[sidecar]>=0.29.0",
    "elasticsearch>=9.4.1",
    "elasticsearch-dsl>=0.0.9",
    "inngest>=0.5.18",
    "markdown>=3.10.2",
    "pillow>=12.2.0",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=6.3.0",
    "django-silk>=5.5.0",
    "pysonar>=1.5.0.4793",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "pytest-factoryboy>=2.8.1",
    "ruff",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
exclude = ["**/migrations/*.py"]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP"  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
    "E741",  # ambiguous variable name 'l', 'O', or 'I'
    "F403",  # 'from module import *' used; unable to detect undefined names
    "F405",  # 'from module import *' used; unable to detect undefined names
    "E402",  # module level import not at top of file
]

[tool.djlint]
profile = "django"
ignore = "H020,H021"
