{% extends "admin/base_site.html" %}
{% load i18n static %}
{% block extrahead %}
    {{ block.super }}
    <script src="{% static 'admin/js/vendor/jquery/jquery.js' %}"
            crossorigin="anonymous"></script>
    <script src="{% static 'admin/js/jquery.init.js' %}" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js" crossorigin="anonymous"></script>
{% endblock %}
{% block content %}
    <div class="row"
         id="filterForm"
         data-url="{% url 'chart_filter_options' %}">
        <div class="col-md-4">
            <label for="year">{% trans "Choose a year" %}:</label>
            <select name="year"
                    id="year"
                    data-url="{% url 'chart_monthly_registrations' %}"></select>
        </div>
        <div class="col-md-4">
            <label for="groupBy">{% trans "View by" %}:</label>
            <select name="groupBy" id="groupBy">
                <option value="month" selected>{% trans "Monthly" %}</option>
                <option value="quarter">{% trans "Quarter" %}</option>
            </select>
        </div>
        <div class="col-md-4">
            <label for="userRole">{% trans "Target role" %}:</label>
            <select name="userRole" id="userRole">
                <option value="user" selected>{% trans "Student" %}</option>
                <option value="teacher">{% trans "Teacher" %}</option>
            </select>
        </div>
    </div>
    <div class="row g-4">
        <div class="col-xl-6 col-12">
            <canvas id="userRegistrationChart"></canvas>
        </div>
        <div class="col-xl-6 col-12">
            <canvas id="salesChart"></canvas>
        </div>
    </div>
    <script src="{% static 'js/statistics.js' %}"></script>
{% endblock %}
