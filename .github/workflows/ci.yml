name: CI Pipeline
run-name: ${{ github.actor }} - CI Pipeline 🚀

on:
    push: 
        branches: ["develop", "features/*", "main"]
    pull_request: 
        branches: ["main", "develop"]

env:
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  SONAR_LOGIN: ${{ secrets.SONAR_LOGIN }}

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd packages/api
          pip install -e ".[dev]"
      
      - name: Lint with ruff
        run: |
          cd packages/api
          ruff check . --output-format=github
        continue-on-error: true

  test-api:
    name: Test Django API
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd packages/api
          pip install -e ".[dev]"
      
      - name: Run pytest with coverage
        run: |
          cd packages/api
          pytest --cov=apps --cov-report=xml --cov-report=html --cov-report=term-summary
      
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-api
          path: packages/api/coverage.xml
          retention-days: 1

  test-web:
    name: Test React Web (Vitest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
      
      - name: Install dependencies
        run: |
          cd packages/web
          bun install
      
      - name: Run Vitest with coverage
        run: |
          cd packages/web
          bun run coverage
      
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-web
          path: packages/web/coverage
          retention-days: 1

  test-e2e:
    name: Test E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [test-api, test-web]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
      
      - name: Install dependencies
        run: |
          cd packages/web
          bun install
      
      - name: Install Playwright browsers
        run: |
          cd packages/web
          bunx playwright install --with-deps
      
      - name: Run Playwright tests
        run: |
          cd packages/web
          bunx playwright test
      
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: packages/web/playwright-report/
          retention-days: 7

  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    needs: [test-api, test-web, test-e2e]
    if: success()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Download API coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-api
          path: packages/api
      
      - name: Download Web coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-web
          path: packages/web
      
      - name: Run SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        with:
          args: >
            -Dsonar.projectKey=edemy
            -Dsonar.sources=packages/api/apps,packages/web/src
            -Dsonar.exclusions=**/node_modules/**,**/migrations/**,**/venv/**,.venv/**
            -Dsonar.python.coverage.reportPaths=packages/api/coverage.xml
            -Dsonar.javascript.lcov.reportPaths=packages/web/coverage/lcov.info
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }}
            -Dsonar.login=${{ env.SONAR_LOGIN }}
      
      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@master
        with:
          scanMetadataReportFile: .scannerwork/report-task.txt
        timeout-minutes: 5
        continue-on-error: false
    