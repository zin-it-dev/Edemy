name: CI Pipeline for Django and React

on:
    push:
        branches: [main, develop, staging]
    pull_request:
        branches: [main, develop, staging]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    django-lint-test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            max-parallel: 4
            matrix:
                python-version: [3.14]

        steps:
            - uses: actions/checkout@v6

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version-file: "./api/pyproject.toml"

            - name: Install uv
              uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
              with:
                  python-version: ${{ matrix.python-version }}
                  enable-cache: true
                  cache-dependency-glob: "./api/pyproject.toml"

            - name: Install the project
              run: uv sync --frozen
              working-directory: ./api

            - name: Run Ruff Checks
              run: uv run ruff check . --fix || true
              working-directory: ./api

            - name: Run Django tests
              run: uv run pytest
              working-directory: ./api
              env:
                  DEBUG: False

    react-lint-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Cache Bun store
              uses: actions/cache@v4
              with:
                  path: ${{ steps.bun-cache.outputs.cache-dir }}
                  key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
                  restore-keys: |
                      ${{ runner.os }}-bun-

            - name: Install dependencies
              run: bun install --frozen-lockfile
              working-directory: ./web

            - name: Run linter
              run: bun run lint
              working-directory: ./web

            - name: Run React tests
              run: bun test -- --watchAll=false
              working-directory: ./web

            - name: Build Application
              run: bun run build --if-present

    build-and-push:
        runs-on: ubuntu-latest
        needs: [django-lint-test, react-lint-test]
        steps:
            - uses: actions/checkout@v6

            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ vars.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build and push
              uses: docker/build-push-action@v7
              id: build-and-push
              with:
                  context: ./api
                  file: ./api/Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ vars.DOCKER_USERNAME }}/${{ github.event.repository.name }}:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Verify Docker Image
              run: echo ${{ steps.build-and-push.outputs.digest }}
