name: Backend CI/CD Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: "dc+o#2fmc+352(l1h*yo2rfv!a(e^n)bcy17$&zdreamutt+*p"
      DJANGO_DEBUG: 1
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      POSTGRES_ENGINE: "postgresql"
      POSTGRES_HOST: "postgres"
      POSTGRES_DB: "edemy"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      ELASTICSEARCH_URL: "http://elasticsearch:9200"
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: "edemy"
          POSTGRES_USER: "postgres"
          POSTGRES_PASSWORD: "postgres"
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: --health-cmd="curl http://localhost:9200/_cluster/health" -e "discovery.type=single-node" -e "xpack.security.enabled=false"

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/local.txt
          pip install dockerize
        working-directory: ./server
      - name: Wait for services to be ready
        run: |
          echo "Waiting for PostgreSQL (5432) and Elasticsearch (9200) to be ready..."
          dockerize -wait tcp://postgres:5432 -timeout 60s
           dockerize -wait tcp://elasticsearch:9200 -timeout 60s
        working-directory: ./server
      - name: Unit tests
        run: pytest
        working-directory: ./server
      - name: Deploy to Production
        if: ${{ success() }}
        run: |
          echo "Deploying to production..."
      - name: Notify on Failure
        if: ${{ failure() }}
        run: |
          echo "Build failed! Sending notification..."
