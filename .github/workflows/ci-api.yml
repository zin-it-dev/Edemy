name: CI - Django 🚀

on:
  push:
    branches: [main, develop, feature/**]
    paths:
      - 'apps/api/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci-api.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/api/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci-api.yml'

jobs:
  test:
    name: 🧪 Testing Django
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/edemy_test
      DJANGO_SETTINGS_MODULE: core.settings.local
      DJANGO_SECRET_KEY: test-secret-key-for-ci-only
      DJANGO_DEBUG: 1
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_DATABASE_URI: postgresql://postgres:postgres@localhost:5432/edemy_test
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: edemy_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: ☺️ Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: 💁 Install dependencies (API)
        working-directory: apps/api
        run: poetry install --no-root

      - name: 😶‍🌫️ Run linter (Ruff)
        working-directory: apps/api
        run: poetry run ruff check --fix --unsafe-fixes .

      - name: 🥲 Run tests (Pytest)
        working-directory: apps/api
        run: poetry run pytest

      - name: 🍡 Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./apps/api/coverage/coverage.xml
          flags: api
          name: api-coverage
