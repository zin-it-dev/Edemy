services:
  web:
    container_name: edemy_web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      target: development
    ports:
      - 5173:5173
    volumes:
      - ./apps/web:/app
      - ./apps/web/node_modules:/app/node_modules
    stdin_open: true
    tty: true
    env_file:
      - ./apps/web/.env

  api:
    container_name: edemy_api
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    restart: always
    volumes:
      - ./apps/api:/app
    ports:
      - 8000:8000
    env_file:
      - ./apps/api/.env

  redis:
    image: redis:7-alpine
    container_name: edemy_redis
    ports:
      - 6379:6379

  worker:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    command: celery -A core worker -l info
    volumes:
      - ./apps/api:/app
    env_file:
      - ./apps/api/.env
    depends_on:
      - redis
      - api

  inngest:
    image: inngest/inngest:latest
    container_name: edemy_inngest
    ports:
      - 8288:8288
    environment:
      - INNGEST_DEV=1
