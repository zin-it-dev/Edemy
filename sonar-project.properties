# ============================================================================
# SonarQube Configuration for Edemy Full Stack Project
# ============================================================================

# PROJECT IDENTIFICATION
# ============================================================================
sonar.projectKey=edemy
sonar.projectName=Edemy - Discover and learn about any topic 🎓
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# SOURCE CODE LOCATIONS
# ============================================================================
sonar.sources=packages/api/apps,packages/web/src
sonar.tests=packages/api/apps,packages/web/src

# TEST FILES PATTERNS
# ============================================================================
sonar.test.inclusions=**/test_*.py,**/*_test.py,**/*.spec.ts,**/*.test.ts

# EXCLUSIONS - Files/Folders to ignore
# ============================================================================
sonar.exclusions=\
  **/node_modules/**,\
  **/migrations/**,\
  **/venv/**,\
  **/.venv/**,\
  **/dist/**,\
  **/build/**,\
  **/.env*,\
  **/Dockerfile*

# COVERAGE REPORTS
# ============================================================================
# Python/Django coverage (pytest-cov output)
sonar.python.coverage.reportPaths=packages/api/coverage.xml
sonar.python.version=3.14

# JavaScript/TypeScript coverage (Vitest output)
sonar.javascript.lcov.reportPaths=packages/web/coverage/lcov.info
sonar.typescript.lcov.reportPaths=packages/web/coverage/lcov.info

# ANALYSIS SETTINGS
# ============================================================================
# Automatically download and use the latest SonarQube analyzer
sonar.language.dynamic.loading=false

# Python-specific settings
sonar.python.pylint_config=.pylintrc
sonar.python.bandit.reportPaths=bandit-report.json

# JavaScript/TypeScript-specific settings
sonar.javascript.environments=browser
sonar.typescript.tsconfigPath=packages/web/tsconfig.json

# ISSUE FILTERING
# ============================================================================
# Treat security hotspots as bugs (recommended for security)
sonar.generic.report.path=

# QUALITY GATE & THRESHOLDS
# ============================================================================
# Wait for quality gate result before finishing
sonar.qualitygate.wait=true

# Custom metrics thresholds (optional, can be configured in SonarQube UI)
# Uncomment below to enforce minimum thresholds:
#
# sonar.projectCoverageExclusions=packages/api/migrations/**,packages/web/__tests__/**
# sonar.coverage.exclusions=**/node_modules/**,**/dist/**
#
# Optional: Override quality gate
# sonar.qualitygate=SonarQay
#
# Performance tuning settings
sonar.analysis.excludeProperties=db.sqlite3,.pytest_cache,.env

# ============================================================================
# CI/CD INTEGRATION SETTINGS
# ============================================================================
# Set to true to enable incremental analysis (faster for large codebases)
sonar.scm.disabled=false

# Parallel analysis (only for SonarQube Enterprise)
# sonar.analysis.mode=preview

# Branch analysis (for Pull Request / Feature Branch analysis)
# sonar.branch.name=${CI_COMMIT_REF_NAME}
# sonar.branch.target=main

